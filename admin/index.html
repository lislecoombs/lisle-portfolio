<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lisle's Admin Panel 🌿</title>
  <style>
    /* Small loading screen while CMS boots */
    body { margin: 0; background: #0e1409; font-family: sans-serif; }
    #loading {
      position: fixed; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: #0e1409; color: #7a9e7e;
      font-size: 1.1rem; gap: 12px; z-index: 999;
    }
    #loading.hidden { display: none; }
  </style>
</head>
<body>
  <div id="loading" id="loading">
    <span style="font-size:2rem">🌿</span>
    Loading your admin panel...
  </div>
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
  <script>
    // Hide loading screen once CMS mounts
    window.addEventListener('load', () => {
      setTimeout(() => {
        const l = document.getElementById('loading');
        if (l) l.classList.add('hidden');
      }, 800);
    });
  </script>
</body>
</html>
