backend:
  name: git-gateway
  branch: main

media_folder: "images"
public_folder: "/images"

show_preview_links: true

collections:

  - name: "site_content"
    label: "My Site 🌿"
    files:

      - name: "profile_photos"
        label: "My Photo & Maggie"
        file: "data/gallery.json"
        fields:

          - label: "About Me Text"
            name: "about_text"
            widget: "text"
            hint: "The paragraph in your About section. A few sentences is plenty."
            required: false

          - label: "My Portrait Photos"
            name: "portrait"
            widget: "list"
            summary: "{{fields.caption}}"
            hint: "Add, remove, or reorder portrait photos. Drag to reorder."
            required: false
            fields:
              - label: "Image"
                name: "image"
                widget: "image"
                hint: "JPG or PNG. Square or portrait crops work best."
              - label: "Caption"
                name: "caption"
                widget: "string"
                hint: "Optional label for this photo."
                required: false

          - label: "Maggie's Photos"
            name: "cat_photo"
            widget: "list"
            summary: "{{fields.caption}}"
            hint: "Add, remove, or reorder Maggie's photos. Drag to reorder."
            required: false
            fields:
              - label: "Image"
                name: "image"
                widget: "image"
                hint: "JPG or PNG."
              - label: "Caption"
                name: "caption"
                widget: "string"
                default: "studio assistant"
                hint: "The little line under this photo."
                required: false

          - label: "Blog Title"
            name: "blog_title"
            widget: "string"
            hint: "The heading for your writing section."
            required: false

          - label: "Blog Writing"
            name: "blog_text"
            widget: "text"
            hint: "Your writing. Line breaks will be preserved."
            required: false

          - label: "Last Updated"
            name: "blog_updated"
            widget: "string"
            hint: "e.g. 'March 2026' - update this when you change anything."
            required: false

          - label: "Blog Photos"
            name: "blog_photos"
            widget: "list"
            summary: "{{fields.blog_caption}}"
            hint: "0 to 3 photos. Each can have 2 versions to cycle through on click."
            required: false
            fields:
              - label: "First Image"
                name: "image1"
                widget: "image"
                hint: "The default photo shown."
                required: false
              - label: "Second Image (optional)"
                name: "image2"
                widget: "image"
                hint: "Click the photo on the site to switch to this one."
                required: false
              - label: "Caption"
                name: "blog_caption"
                widget: "string"
                required: false

          - label: "Paintings"
            name: "paintings"
            widget: "list"
            summary: "{{fields.title}} ({{fields.year}})"
            hint: "Add, remove, or reorder paintings. Drag to reorder."
            fields:
              - label: "Title"
                name: "title"
                widget: "string"
                hint: "e.g. 'Dusk Study' or 'Untitled No. 3'"
              - label: "Year"
                name: "year"
                widget: "string"
                hint: "e.g. '2024'"
                required: false
              - label: "Medium"
                name: "medium"
                widget: "string"
                hint: "e.g. 'Oil on canvas'"
                required: false
              - label: "Dimensions"
                name: "dimensions"
                widget: "string"
                hint: "e.g. '30 x 40 cm'"
                required: false
              - label: "Description"
                name: "description"
                widget: "text"
                hint: "Optional note. Shows in the lightbox when clicked."
                required: false
              - label: "Image"
                name: "image"
                widget: "image"
                hint: "JPG or PNG, under 5MB recommended."

          - label: "Drawings"
            name: "drawings"
            widget: "list"
            summary: "{{fields.title}} ({{fields.year}})"
            hint: "Add, remove, or reorder drawings."
            fields:
              - label: "Title"
                name: "title"
                widget: "string"
              - label: "Year"
                name: "year"
                widget: "string"
                required: false
              - label: "Medium"
                name: "medium"
                widget: "string"
                hint: "e.g. 'Graphite on paper'"
                required: false
              - label: "Dimensions"
                name: "dimensions"
                widget: "string"
                hint: "e.g. '21 x 29.7 cm'"
                required: false
              - label: "Description"
                name: "description"
                widget: "text"
                required: false
              - label: "Image"
                name: "image"
                widget: "image"

          - label: "Sculpture"
            name: "sculpture"
            widget: "list"
            summary: "{{fields.title}} ({{fields.year}})"
            hint: "Add, remove, or reorder sculptures."
            fields:
              - label: "Title"
                name: "title"
                widget: "string"
              - label: "Year"
                name: "year"
                widget: "string"
                required: false
              - label: "Medium"
                name: "medium"
                widget: "string"
                hint: "e.g. 'Stoneware clay, wood-fired'"
                required: false
              - label: "Dimensions"
                name: "dimensions"
                widget: "string"
                hint: "e.g. '15 x 8 x 8 cm'"
                required: false
              - label: "Description"
                name: "description"
                widget: "text"
                required: false
              - label: "Image"
                name: "image"
                widget: "image"

          - label: "Photography"
            name: "photography"
            widget: "list"
            summary: "{{fields.title}} ({{fields.year}})"
            hint: "Add, remove, or reorder photographs."
            fields:
              - label: "Title"
                name: "title"
                widget: "string"
              - label: "Year"
                name: "year"
                widget: "string"
                required: false
              - label: "Medium"
                name: "medium"
                widget: "string"
                hint: "e.g. 'Digital photograph' or '35mm film'"
                required: false
              - label: "Dimensions"
                name: "dimensions"
                widget: "string"
                hint: "e.g. '40 x 60 cm print'"
                required: false
              - label: "Description"
                name: "description"
                widget: "text"
                required: false
              - label: "Image"
                name: "image"
                widget: "image"
